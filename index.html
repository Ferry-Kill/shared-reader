<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Read">
<link rel="manifest" href="manifest.json">
<title>Ferillove · Read</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0d0d0f;
  --bg-reader: #1a1a1e;
  --rose: #c49a9e;
  --rose-light: #e8d4d8;
  --rose-dim: rgba(196, 154, 158, 0.3);
  --warm-brown: rgba(180, 130, 90, 0.35);
  --warm-brown-solid: #b4825a;
  --deep-gray: rgba(120, 120, 130, 0.35);
  --deep-gray-solid: #78788c;
  --text: #e8d4d8;
  --text-dim: rgba(232, 212, 216, 0.5);
}

body {
  font-family: 'Noto Serif SC', 'Noto Sans SC', serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}

/* ===== Bookshelf ===== */
.view { display: none; width: 100%; height: 100vh; }
.view.active { display: flex; flex-direction: column; }

.shelf-header {
  padding: 50px 30px 20px;
  text-align: center;
}

.shelf-title {
  font-family: 'Caveat', cursive;
  font-size: 2.4em;
  font-weight: 500;
  color: var(--rose-light);
  letter-spacing: 0.05em;
}

.shelf-subtitle {
  font-family: 'Caveat', cursive;
  font-size: 1em;
  color: var(--rose-dim);
  margin-top: 5px;
  letter-spacing: 0.1em;
}

.shelf-grid {
  flex: 1;
  overflow-y: auto;
  padding: 20px 25px 100px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  align-content: start;
}

.shelf-grid::-webkit-scrollbar { width: 0; }

.book-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: transform 0.2s;
}

.book-card:active { transform: scale(0.95); }

.book-cover {
  width: 100%;
  aspect-ratio: 2/3;
  border-radius: 6px;
  background: linear-gradient(135deg, rgba(196, 154, 158, 0.15), rgba(196, 154, 158, 0.05));
  border: 1px solid rgba(196, 154, 158, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  overflow: hidden;
  position: relative;
}

.book-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 4px;
}

.book-cover-text {
  font-family: 'Noto Serif SC', serif;
  font-size: 0.85em;
  color: var(--rose-light);
  text-align: center;
  line-height: 1.4;
  word-break: break-all;
}

.book-progress {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: rgba(0,0,0,0.3);
}

.book-progress-bar {
  height: 100%;
  background: var(--rose);
  transition: width 0.3s;
}

.book-name {
  margin-top: 8px;
  font-size: 0.75em;
  color: var(--text-dim);
  text-align: center;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.add-card .book-cover {
  border: 2px dashed rgba(196, 154, 158, 0.2);
  background: transparent;
}

.add-icon {
  font-family: 'Caveat', cursive;
  font-size: 2.5em;
  color: var(--rose-dim);
}

#fileInput { display: none; }

/* ===== Reader ===== */
#readerView {
  position: relative;
  overflow: hidden;
}

.reader-header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  padding: 8px 16px;
  padding-top: calc(8px + env(safe-area-inset-top));
  background: rgba(13,13,15,0.9);
  transform: translateY(-100%);
  transition: transform 0.25s ease;
}

.reader-header.show {
  transform: translateY(0);
}

.reader-back {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3em;
  color: var(--rose-light);
  cursor: pointer;
  border: none;
  background: none;
}

.reader-book-title {
  flex: 1;
  text-align: center;
  font-family: 'Caveat', 'Noto Serif SC', cursive;
  font-size: 1em;
  font-weight: 400;
  color: var(--rose-light);
  opacity: 0.7;
  letter-spacing: 0.1em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0 10px;
}

.reader-menu-btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1em;
  color: var(--rose-light);
  cursor: pointer;
  border: none;
  background: none;
}

#epubContainer {
  width: 100%;
  height: calc(100vh - 48px);
  background: var(--bg-reader);
}

.nav-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 8;
  width: 36px;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8em;
  color: rgba(196, 154, 158, 0.25);
  cursor: pointer;
  border-radius: 8px;
  transition: color 0.2s, background 0.2s;
  -webkit-user-select: none;
  user-select: none;
}

.nav-arrow:active {
  color: rgba(196, 154, 158, 0.6);
  background: rgba(196, 154, 158, 0.08);
}

.nav-prev { left: 2px; }
.nav-next { right: 2px; }

.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 10px 20px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  background: rgba(13,13,15,0.92);
  transform: translateY(100%);
  transition: transform 0.25s ease;
}

.bottom-bar.show {
  transform: translateY(0);
}

.bar-btn {
  border: none;
  background: none;
  color: rgba(196, 154, 158, 0.5);
  font-size: 1.2em;
  padding: 8px 12px;
  cursor: pointer;
  transition: color 0.2s;
  font-family: 'Caveat', cursive;
}

.bar-btn:active { color: var(--rose-light); }
.bar-btn.active { color: var(--rose-light); }

.slider-popup {
  position: fixed;
  bottom: 65px;
  left: 20px;
  right: 20px;
  background: rgba(20, 20, 24, 0.95);
  border: 1px solid rgba(196, 154, 158, 0.15);
  border-radius: 14px;
  padding: 14px 18px;
  display: none;
  align-items: center;
  gap: 10px;
  z-index: 11;
}

.slider-popup.show { display: flex; }

.font-popup-multi {
  flex-direction: column;
  gap: 8px;
}

.font-popup-multi.show { display: flex; }

.slider-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
}

.stats-popup {
  flex-direction: column;
  gap: 6px;
}

.stats-popup.show { display: flex; }

.stats-content {
  width: 100%;
  font-family: 'Caveat', cursive;
  font-size: 0.95em;
  color: var(--rose-light);
  line-height: 1.7;
}

.stats-line {
  display: flex;
  justify-content: space-between;
  color: var(--text-dim);
  font-size: 0.85em;
}

.stats-line .stats-val {
  color: var(--rose-light);
}

.export-btn {
  font-size: 1.1em !important;
  width: 32px !important;
  padding: 0 !important;
}

.slider-popup label {
  font-family: 'Caveat', cursive;
  font-size: 0.9em;
  color: var(--rose-dim);
  min-width: 24px;
}

.slider-popup input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 3px;
  background: rgba(196, 154, 158, 0.2);
  border-radius: 2px;
  outline: none;
}

.slider-popup input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--rose);
  cursor: pointer;
}

/* TOC panel */
.toc-panel {
  position: fixed;
  top: 0; left: -100%; bottom: 0;
  width: 80%;
  max-width: 320px;
  z-index: 150;
  background: rgba(20, 20, 24, 0.98);
  border-right: 1px solid rgba(196, 154, 158, 0.1);
  transition: left 0.3s ease;
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(10px);
}

.toc-panel.show { left: 0; }

.toc-header {
  padding: 50px 20px 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.toc-title {
  font-family: 'Caveat', cursive;
  font-size: 1.5em;
  color: var(--rose-light);
}

.toc-close {
  border: none;
  background: none;
  color: var(--text-dim);
  font-size: 1.2em;
  cursor: pointer;
}

.toc-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px 0 30px;
}

.toc-list::-webkit-scrollbar { width: 3px; }
.toc-list::-webkit-scrollbar-thumb { background: rgba(196, 154, 158, 0.15); border-radius: 3px; }

.toc-item {
  padding: 10px 20px;
  font-size: 0.9em;
  color: var(--text-dim);
  cursor: pointer;
  transition: background 0.2s;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}

.toc-item:active { background: rgba(196, 154, 158, 0.1); }
.toc-item.active { color: var(--rose-light); }


/* ===== Highlight Menu ===== */
.highlight-menu {
  position: fixed;
  z-index: 100;
  background: rgba(30, 30, 34, 0.95);
  border: 1px solid rgba(196, 154, 158, 0.2);
  border-radius: 20px;
  padding: 6px 4px;
  display: none;
  gap: 2px;
  backdrop-filter: blur(10px);
}

.highlight-menu.show { display: flex; }

.hl-btn {
  border: none;
  background: none;
  color: var(--rose-light);
  font-family: 'Caveat', cursive;
  font-size: 0.95em;
  padding: 6px 14px;
  border-radius: 16px;
  cursor: pointer;
  transition: background 0.2s;
}

.hl-btn:active { background: rgba(196, 154, 158, 0.2); }

.hl-btn.delete { color: rgba(232, 212, 216, 0.4); }

/* ===== Note Input ===== */
.note-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 200;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 30px;
}

.note-overlay.show { display: flex; }

.note-box {
  width: 100%;
  max-width: 340px;
  background: #1e1e22;
  border: 1px solid rgba(196, 154, 158, 0.15);
  border-radius: 16px;
  padding: 20px;
}

.note-label {
  font-family: 'Caveat', cursive;
  font-size: 1.1em;
  color: var(--rose-light);
  margin-bottom: 4px;
}

.note-quote {
  font-size: 0.8em;
  color: var(--text-dim);
  margin-bottom: 12px;
  line-height: 1.5;
  max-height: 60px;
  overflow: hidden;
  border-left: 2px solid var(--warm-brown-solid);
  padding-left: 10px;
}

.note-textarea {
  width: 100%;
  min-height: 80px;
  background: rgba(196, 154, 158, 0.08);
  border: 1px solid rgba(196, 154, 158, 0.15);
  border-radius: 10px;
  padding: 12px;
  color: var(--text);
  font-family: 'Noto Serif SC', serif;
  font-size: 0.9em;
  line-height: 1.6;
  resize: none;
  outline: none;
}

.note-textarea:focus { border-color: var(--rose-dim); }

.note-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 12px;
}

.note-btn {
  border: none;
  background: none;
  font-family: 'Caveat', cursive;
  font-size: 1.05em;
  padding: 6px 16px;
  border-radius: 14px;
  cursor: pointer;
  transition: background 0.2s;
}

.note-btn.cancel { color: var(--text-dim); }
.note-btn.save { color: var(--rose-light); background: rgba(196, 154, 158, 0.15); }
.note-btn.save:active { background: rgba(196, 154, 158, 0.3); }

/* ===== Annotations Panel ===== */
.annotations-panel {
  position: fixed;
  top: 0; right: -100%; bottom: 0;
  width: 85%;
  max-width: 360px;
  z-index: 150;
  background: rgba(20, 20, 24, 0.98);
  border-left: 1px solid rgba(196, 154, 158, 0.1);
  transition: right 0.3s ease;
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(10px);
}

.annotations-panel.show { right: 0; }

.ann-header {
  padding: 50px 20px 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.ann-title {
  font-family: 'Caveat', cursive;
  font-size: 1.5em;
  color: var(--rose-light);
}

.ann-close {
  border: none;
  background: none;
  color: var(--text-dim);
  font-size: 1.2em;
  cursor: pointer;
}

.ann-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px 20px 30px;
}

.ann-list::-webkit-scrollbar { width: 3px; }
.ann-list::-webkit-scrollbar-thumb { background: rgba(196, 154, 158, 0.15); border-radius: 3px; }

.ann-item {
  margin-bottom: 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(196, 154, 158, 0.06);
}

.ann-quote {
  font-size: 0.85em;
  color: var(--text-dim);
  line-height: 1.6;
  margin-bottom: 8px;
  padding-left: 10px;
  border-left: 2px solid var(--warm-brown-solid);
}

.ann-time {
  font-family: 'Caveat', cursive;
  font-size: 0.75em;
  color: var(--text-dim);
  opacity: 0.5;
  margin-bottom: 6px;
}

.ann-note {
  font-size: 0.85em;
  line-height: 1.6;
  padding-left: 10px;
  margin-top: 6px;
}

.ann-note.ferry {
  color: var(--warm-brown-solid);
  border-left: 2px solid var(--warm-brown-solid);
}

.ann-note.killian {
  color: var(--deep-gray-solid);
  border-left: 2px solid var(--deep-gray-solid);
}

.ann-note-label {
  font-family: 'Caveat', cursive;
  font-size: 0.8em;
  opacity: 0.6;
  margin-bottom: 2px;
}

.ann-empty {
  text-align: center;
  color: var(--text-dim);
  font-family: 'Caveat', cursive;
  font-size: 1.1em;
  margin-top: 60px;
}

/* ===== Chapter reveal ===== */
.reveal-btn {
  display: none;
  margin: 15px auto;
  border: none;
  background: rgba(196, 154, 158, 0.12);
  color: var(--rose-light);
  font-family: 'Caveat', cursive;
  font-size: 1em;
  padding: 8px 24px;
  border-radius: 20px;
  cursor: pointer;
}

.reveal-btn.show { display: block; }
.reveal-btn:active { background: rgba(196, 154, 158, 0.25); }

/* ===== Overlay backdrop ===== */
.panel-backdrop {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 140;
  background: rgba(0,0,0,0.5);
  display: none;
}

.panel-backdrop.show { display: block; }

/* ===== Loading ===== */
.loading {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 300;
  background: var(--bg);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 15px;
}

.loading.show { display: flex; }

.loading-text {
  font-family: 'Caveat', cursive;
  font-size: 1.3em;
  color: var(--rose-light);
  animation: pulse-load 1.5s infinite;
}

@keyframes pulse-load {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* ===== Context menu for book card ===== */
.ctx-menu {
  position: fixed;
  z-index: 100;
  background: rgba(30, 30, 34, 0.95);
  border: 1px solid rgba(196, 154, 158, 0.2);
  border-radius: 12px;
  padding: 6px;
  display: none;
  flex-direction: column;
  backdrop-filter: blur(10px);
  min-width: 120px;
}

.ctx-menu.show { display: flex; }

.ctx-item {
  border: none;
  background: none;
  color: var(--rose-light);
  font-family: 'Caveat', cursive;
  font-size: 1em;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
}

.ctx-item:active { background: rgba(196, 154, 158, 0.15); }
.ctx-item.danger { color: rgba(220, 100, 100, 0.8); }
</style>
</head>
<body>

<!-- Bookshelf View -->
<div id="shelfView" class="view active">
  <div class="shelf-header">
    <div class="shelf-title">Ferillove · Read</div>
    <div class="shelf-subtitle">our bookshelf</div>
  </div>
  <div class="shelf-grid" id="shelfGrid"></div>
  <input type="file" id="fileInput" accept=".epub,application/epub+zip,*/*">
</div>

<!-- Reader View -->
<div id="readerView" class="view">
  <div id="epubContainer"></div>

  <div class="nav-arrow nav-prev" id="navPrev">‹</div>
  <div class="nav-arrow nav-next" id="navNext">›</div>

  <div class="reader-header" id="readerHeader">
    <button class="reader-back" id="backBtn">&lt;</button>
    <div class="reader-book-title" id="readerBookTitle"></div>
    <button class="reader-menu-btn" id="notesBtn"><span id="notesLabel">♡ Notes</span></button>
    <button class="reader-menu-btn export-btn" id="exportBtn">⤓</button>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <button class="bar-btn" id="tocBtn">☰</button>
    <button class="bar-btn" id="brightBtn">☀</button>
    <button class="bar-btn" id="bleBtn">I</button>
    <button class="bar-btn" id="fontBtn">A</button>
    <button class="bar-btn" id="statsBtn">◔</button>
  </div>

  <div class="slider-popup" id="brightPopup">
    <label>☀</label>
    <input type="range" id="brightnessSlider" min="0" max="100" value="15">
  </div>

  <div class="slider-popup font-popup-multi" id="fontPopup">
    <div class="slider-row">
      <label>A</label>
      <input type="range" id="fontSizeSlider" min="14" max="28" value="16">
    </div>
    <div class="slider-row">
      <label>≡</label>
      <input type="range" id="lineHeightSlider" min="14" max="30" value="18">
    </div>
  </div>

  <!-- Stats panel -->
  <div class="slider-popup stats-popup" id="statsPopup">
    <div class="stats-content" id="statsContent"></div>
  </div>
</div>

<!-- TOC panel -->
<div class="toc-panel" id="tocPanel">
  <div class="toc-header">
    <div class="toc-title">Contents</div>
    <button class="toc-close" id="tocClose">✕</button>
  </div>
  <div class="toc-list" id="tocList"></div>
</div>

<!-- Highlight menu -->
<div class="highlight-menu" id="highlightMenu">
  <button class="hl-btn" id="hlHighlight">Highlight</button>
  <button class="hl-btn" id="hlNote">Note</button>
  <button class="hl-btn delete" id="hlRemove" style="display:none">Remove</button>
</div>

<!-- Note input overlay -->
<div class="note-overlay" id="noteOverlay">
  <div class="note-box">
    <div class="note-label">Your note</div>
    <div class="note-quote" id="noteQuote"></div>
    <textarea class="note-textarea" id="noteTextarea" placeholder="write something..."></textarea>
    <div class="note-actions">
      <button class="note-btn cancel" id="noteCancel">Cancel</button>
      <button class="note-btn save" id="noteSave">Save</button>
    </div>
  </div>
</div>

<!-- Annotations panel -->
<div class="panel-backdrop" id="panelBackdrop"></div>
<div class="annotations-panel" id="annPanel">
  <div class="ann-header">
    <div class="ann-title">Notes</div>
    <button class="ann-close" id="annClose">✕</button>
  </div>
  <button class="reveal-btn" id="revealBtn">Reveal Killian's notes ♡</button>
  <div class="ann-list" id="annList"></div>
</div>

<!-- Book context menu -->
<div class="ctx-menu" id="ctxMenu">
  <button class="ctx-item" id="ctxOpen">Open</button>
  <button class="ctx-item danger" id="ctxDelete">Delete</button>
</div>

<!-- Loading -->
<div class="loading" id="loading">
  <div class="loading-text">Loading...</div>
</div>

<script>
const DB_NAME = 'ferillove-reader';
const DB_VERSION = 1;
const RELAY_SERVER = 'wss://killian-i.duckdns.org:8444';
const API_SERVER = 'https://killian-i.duckdns.org:8444';

let db = null;
let currentBook = null;
let book = null;
let rendition = null;
let currentCfi = null;
let uiVisible = false;
let touchStartX = 0;
let touchStartY = 0;
let selectedCfiRange = null;

// ===== IndexedDB =====
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('books')) {
        db.createObjectStore('books', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('highlights')) {
        db.createObjectStore('highlights', { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e);
  });
}

function dbPut(store, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(data);
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}

function dbGet(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = reject;
  });
}

function dbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = reject;
  });
}

function dbDelete(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}

// ===== Bookshelf =====
async function renderShelf() {
  const books = await dbGetAll('books');
  const grid = document.getElementById('shelfGrid');
  grid.innerHTML = '';

  books.forEach(b => {
    const card = document.createElement('div');
    card.className = 'book-card';
    card.onclick = () => openBook(b.id);
    card.oncontextmenu = (e) => { e.preventDefault(); showCtxMenu(e, b.id); };

    let coverHTML;
    if (b.cover) {
      coverHTML = `<img src="${b.cover}" alt="">`;
    } else {
      coverHTML = `<div class="book-cover-text">${b.title}</div>`;
    }

    const progress = b.progress || 0;
    card.innerHTML = `
      <div class="book-cover">
        ${coverHTML}
        <div class="book-progress"><div class="book-progress-bar" style="width:${progress}%"></div></div>
      </div>
      <div class="book-name">${b.title}</div>
    `;

    let pressTimer;
    card.addEventListener('touchstart', (e) => {
      pressTimer = setTimeout(() => {
        e.preventDefault();
        showCtxMenu(e.touches[0], b.id);
      }, 500);
    });
    card.addEventListener('touchend', () => clearTimeout(pressTimer));
    card.addEventListener('touchmove', () => clearTimeout(pressTimer));

    grid.appendChild(card);
  });

  // Add button
  const addCard = document.createElement('div');
  addCard.className = 'book-card add-card';
  addCard.onclick = () => document.getElementById('fileInput').click();
  addCard.innerHTML = `
    <div class="book-cover"><div class="add-icon">+</div></div>
    <div class="book-name">Import</div>
  `;
  grid.appendChild(addCard);
}

// ===== File Import =====
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  showLoading(true);

  try {
    document.querySelector('.loading-text').textContent = 'Reading file...';
    const arrayBuffer = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsArrayBuffer(file);
    });

    document.querySelector('.loading-text').textContent = 'Saving to library...';
    const title = file.name.replace(/\.epub$/i, '');
    const id = 'book_' + Date.now();
    const bookData = {
      id,
      title,
      author: '',
      data: arrayBuffer,
      cover: null,
      progress: 0,
      location: null,
      addedAt: Date.now()
    };

    await dbPut('books', bookData);
    document.querySelector('.loading-text').textContent = 'Loading...';
    renderShelf();
  } catch (err) {
    console.error('Import error:', err);
    alert('Import failed: ' + (err.message || err));
  }

  showLoading(false);
  e.target.value = '';
});

function blobToDataURL(blob) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}

// ===== Reader =====
async function openBook(bookId) {
  showLoading(true);

  try {
    document.querySelector('.loading-text').textContent = 'Loading book...';
    const bookData = await dbGet('books', bookId);
    if (!bookData) { showLoading(false); return; }

    currentBook = bookData;
    const arrayBuffer = bookData.data instanceof ArrayBuffer ? bookData.data : new Uint8Array(bookData.data).buffer;

    if (book) book.destroy();

    document.querySelector('.loading-text').textContent = 'Parsing...';
    book = ePub(arrayBuffer);

    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('Parsing timed out (15s)')), 15000));
    await Promise.race([book.ready, timeout]);

    document.querySelector('.loading-text').textContent = 'Rendering...';

    document.getElementById('shelfView').classList.remove('active');
    document.getElementById('readerView').classList.add('active');
    document.getElementById('readerBookTitle').textContent = bookData.title;

    const container = document.getElementById('epubContainer');
    container.innerHTML = '';

    rendition = book.renderTo(container, {
      width: '100%',
      height: '100%',
      spread: 'none',
      flow: 'paginated'
    });


    if (bookData.location) {
      await rendition.display(bookData.location);
    } else {
      await rendition.display();
    }

    // Restore saved settings
    const savedBright = localStorage.getItem('reader_brightness');
    const savedFont = localStorage.getItem('reader_fontsize');
    const savedLH = localStorage.getItem('reader_lineheight');
    if (savedBright) document.getElementById('brightnessSlider').value = savedBright;
    if (savedFont) document.getElementById('fontSizeSlider').value = savedFont;
    if (savedLH) document.getElementById('lineHeightSlider').value = savedLH;
    applyReaderStyles();

    // Load and apply highlights
    await loadHighlights(bookId);
    updateNotesCount();
    startReadingTimer();

    // Events
    rendition.on('relocated', (location) => {
      currentCfi = location.start.cfi;
      updateProgress(location);
      saveProgress(location);
      hideHighlightMenu();
    });

    rendition.on('selected', (cfiRange, contents) => {
      const range = rendition.getRange(cfiRange);
      if (range) {
        selectedText = range.toString().trim();
        selectedCfiRange = cfiRange;
        if (selectedText.length > 0) {
          const rect = range.getBoundingClientRect();
          const iframe = container.querySelector('iframe');
          const iframeRect = iframe.getBoundingClientRect();
          showHighlightMenu(
            iframeRect.left + rect.left + rect.width / 2,
            iframeRect.top + rect.top - 10
          );
        }
      }
    });

    rendition.on('rendered', (section) => {
      const doc = rendition.getContents()[0]?.document;
      if (doc && !doc._setup) {
        doc._setup = true;
        doc.addEventListener('contextmenu', (e) => e.preventDefault());
        let tapStart = 0, tapX = 0, tapY = 0;
        doc.addEventListener('touchstart', (e) => {
          tapStart = Date.now(); tapX = e.touches[0].clientX; tapY = e.touches[0].clientY;
        }, { passive: true });
        doc.addEventListener('touchend', (e) => {
          const dt = Date.now() - tapStart;
          const dx = Math.abs(e.changedTouches[0].clientX - tapX);
          const dy = Math.abs(e.changedTouches[0].clientY - tapY);
          if (dt < 250 && dx < 10 && dy < 10) {
            if (hlMenuJustOpened) { hlMenuJustOpened = false; return; }
            const sel = doc.getSelection();
            if (!sel || sel.toString().trim().length === 0) {
              if (document.getElementById('highlightMenu').classList.contains('show')) {
                hideHighlightMenu();
              } else {
                toggleUI();
              }
            }
          }
        });
      }
    });

    showLoading(false);

  } catch (err) {
    console.error('Open book error:', err);
    showLoading(false);
    goToShelf();
  }
}

function applyReaderStyles() {
  if (!rendition) return;
  const bright = parseInt(document.getElementById('brightnessSlider').value);
  const fontSize = document.getElementById('fontSizeSlider').value;
  const lineHeight = (parseInt(document.getElementById('lineHeightSlider').value) / 10).toFixed(1);

  const r = Math.round(26 + (bright / 100) * 229);
  const g = Math.round(26 + (bright / 100) * 229);
  const b = Math.round(30 + (bright / 100) * 225);
  const bg = `rgb(${r},${g},${b})`;

  let textColor;
  if (bright > 50) {
    const tv = Math.round(60 - (bright - 50) * 0.8);
    textColor = `rgb(${tv},${tv},${tv})`;
  } else {
    const tv = Math.round(180 + (bright / 50) * 55);
    textColor = `rgb(${tv},${tv - 12},${tv - 20})`;
  }

  rendition.themes.default({
    'body': {
      'background': bg + ' !important',
      'color': textColor + ' !important',
      'font-family': "'Noto Serif SC', 'Noto Sans SC', serif !important",
      'line-height': lineHeight + ' !important',
      'padding': '20px 16px !important',
      'font-size': fontSize + 'px !important'
    },
    'p': { 'color': textColor + ' !important', 'line-height': lineHeight + ' !important', 'margin-bottom': '0.8em !important' },
    'h1,h2,h3,h4,h5,h6': { 'color': textColor + ' !important' },
    'a': { 'color': '#c49a9e !important' },
    'img': { 'max-width': '100% !important' }
  });

  document.getElementById('epubContainer').style.background = bg;
  localStorage.setItem('reader_brightness', bright);
  localStorage.setItem('reader_fontsize', fontSize);
  localStorage.setItem('reader_lineheight', document.getElementById('lineHeightSlider').value);

  // Force re-pagination after style change
  if (rendition.manager) {
    try { rendition.manager.resize(); } catch(e) {}
  }
}

// ===== Highlights =====
async function loadHighlights(bookId) {
  // Remove all existing annotations first
  if (rendition) {
    for (const id in highlights) {
      try { rendition.annotations.remove(highlights[id].cfiRange, 'highlight'); } catch(e) {}
    }
  }
  const allHL = await dbGetAll('highlights');
  highlights = {};
  allHL.filter(h => h.bookId === bookId).forEach(h => {
    highlights[h.id] = h;
    applyHighlight(h);
  });
}

function applyHighlight(hl) {
  if (!rendition) return;
  try {
    const color = hl.owner === 'killian' ? 'rgba(120,120,130,0.35)' : 'rgba(180,130,90,0.35)';
    rendition.annotations.highlight(hl.cfiRange, { id: hl.id }, (e) => {
      e.preventDefault();
      showExistingHighlightMenu(hl.id, e);
    }, '', { fill: color, 'fill-opacity': '1', 'mix-blend-mode': 'multiply' });
  } catch (e) {}
}

function showHighlightMenu(x, y) {
  const menu = document.getElementById('highlightMenu');
  document.getElementById('hlRemove').style.display = 'none';
  document.getElementById('hlHighlight').style.display = '';
  document.getElementById('hlNote').style.display = '';
  menu.style.left = Math.max(10, Math.min(x - 60, window.innerWidth - 150)) + 'px';
  menu.style.top = Math.max(10, y - 45) + 'px';
  menu.classList.add('show');
}

let activeHlMenuId = null;
let hlMenuJustOpened = false;
let hlMenuDebounce = 0;

function showExistingHighlightMenu(hlId, e) {
  const now = Date.now();
  if (now - hlMenuDebounce < 400) return;
  hlMenuDebounce = now;

  if (activeHlMenuId === hlId && document.getElementById('highlightMenu').classList.contains('show')) {
    hideHighlightMenu();
    return;
  }

  activeHlMenuId = hlId;
  selectedCfiRange = highlights[hlId]?.cfiRange;
  selectedText = highlights[hlId]?.text;
  const menu = document.getElementById('highlightMenu');
  document.getElementById('hlRemove').style.display = '';
  document.getElementById('hlRemove').onclick = () => removeHighlight(hlId);
  document.getElementById('hlHighlight').style.display = 'none';
  document.getElementById('hlNote').style.display = '';

  let x = window.innerWidth / 2, y = 200;
  try {
    const cfi = highlights[hlId]?.cfiRange;
    if (cfi && rendition) {
      const range = rendition.getRange(cfi);
      if (range) {
        const rect = range.getBoundingClientRect();
        const iframe = document.querySelector('#epubContainer iframe');
        if (iframe) {
          const ir = iframe.getBoundingClientRect();
          x = ir.left + rect.left + rect.width / 2;
          y = ir.top + rect.top - 10;
        }
      }
    }
  } catch(err) {}
  menu.style.left = Math.max(10, Math.min(x - 50, window.innerWidth - 150)) + 'px';
  menu.style.top = Math.max(10, y - 40) + 'px';
  menu.classList.add('show');
  hlMenuJustOpened = true;

  document.getElementById('hlNote').onclick = () => {
    hideHighlightMenu();
    showNoteInput(hlId);
  };
}

function hideHighlightMenu() {
  document.getElementById('highlightMenu').classList.remove('show');
  activeHlMenuId = null;
}


document.getElementById('hlHighlight').onclick = async () => {
  if (!selectedCfiRange || !selectedText || !currentBook) return;
  hideHighlightMenu();

  const hl = {
    id: 'hl_' + Date.now(),
    bookId: currentBook.id,
    cfiRange: selectedCfiRange,
    text: selectedText,
    owner: 'ferry',
    note: '',
    createdAt: Date.now()
  };

  highlights[hl.id] = hl;
  await dbPut('highlights', hl);
  applyHighlight(hl);
  clearSelection();
  updateNotesCount();
  syncHighlight(hl);
};

document.getElementById('hlNote').onclick = () => {
  hideHighlightMenu();

  if (!selectedCfiRange || !selectedText || !currentBook) return;

  // Check if highlight already exists for this range
  const existing = Object.values(highlights).find(h => h.cfiRange === selectedCfiRange);
  if (existing) {
    showNoteInput(existing.id);
  } else {
    // Create highlight first, then open note
    const hl = {
      id: 'hl_' + Date.now(),
      bookId: currentBook.id,
      cfiRange: selectedCfiRange,
      text: selectedText,
      owner: 'ferry',
      note: '',
      createdAt: Date.now()
    };
    highlights[hl.id] = hl;
    dbPut('highlights', hl);
    applyHighlight(hl);
    clearSelection();
    showNoteInput(hl.id);
  }
};

function showNoteInput(hlId) {
  const hl = highlights[hlId];
  if (!hl) return;

  document.getElementById('noteQuote').textContent = hl.text;
  document.getElementById('noteTextarea').value = hl.note || '';
  document.getElementById('noteOverlay').classList.add('show');

  document.getElementById('noteSave').onclick = async () => {
    hl.note = document.getElementById('noteTextarea').value.trim();
    highlights[hlId] = hl;
    await dbPut('highlights', hl);
    document.getElementById('noteOverlay').classList.remove('show');
    syncHighlight(hl);
  };

  document.getElementById('noteCancel').onclick = () => {
    document.getElementById('noteOverlay').classList.remove('show');
  };
}

async function removeHighlight(hlId) {
  hideHighlightMenu();
  const hl = highlights[hlId];
  if (!hl) return;

  try {
    rendition.annotations.remove(hl.cfiRange, 'highlight');
  } catch (e) {}

  delete highlights[hlId];
  await dbDelete('highlights', hlId);
  updateNotesCount();
}

function clearSelection() {
  try {
    const contents = rendition.getContents();
    contents.forEach(c => {
      const sel = c.document.getSelection();
      if (sel) sel.removeAllRanges();
    });
  } catch (e) {}
  selectedCfiRange = null;
  selectedText = '';
}

function renderAnnotations() {
  const list = document.getElementById('annList');
  const hls = Object.values(highlights).sort((a, b) => a.createdAt - b.createdAt);

  if (hls.length === 0) {
    list.innerHTML = '<div class="ann-empty">No notes yet. Start reading ♡</div>';
    document.getElementById('revealBtn').classList.remove('show');
    return;
  }

  const hasKillianNotes = hls.some(h => h.killianNote && !h.killianRevealed);
  document.getElementById('revealBtn').classList.toggle('show', hasKillianNotes);

  list.innerHTML = '';
  hls.forEach(hl => {
    const item = document.createElement('div');
    item.className = 'ann-item';

    const date = new Date(hl.createdAt);
    const ts = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    let html = `<div class="ann-quote">"${escapeHTML(hl.text)}"</div><div class="ann-time">${ts}</div>`;

    if (hl.note) {
      html += `<div class="ann-note ferry">
        <div class="ann-note-label">Ferry</div>
        ${escapeHTML(hl.note)}
      </div>`;
    }

    if (hl.killianNote && hl.killianRevealed) {
      html += `<div class="ann-note killian">
        <div class="ann-note-label">Killian</div>
        ${escapeHTML(hl.killianNote)}
      </div>`;
    }

    item.innerHTML = html;
    item.onclick = () => {
      closeAnnotationsPanel();
      if (hl.cfiRange) {
        rendition.display(hl.cfiRange);
      }
    };
    list.appendChild(item);
  });
}

document.getElementById('revealBtn').onclick = async () => {
  const hls = Object.values(highlights);
  for (const hl of hls) {
    if (hl.killianNote && !hl.killianRevealed) {
      hl.killianRevealed = true;
      highlights[hl.id] = hl;
      await dbPut('highlights', hl);
    }
  }
  document.getElementById('revealBtn').classList.remove('show');
  renderAnnotations();
};

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== WebSocket =====
function connectWS() {
  if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
  try {
    ws = new WebSocket(RELAY_SERVER);
    ws.onopen = () => {
      console.log('WS connected');
      ws.send(JSON.stringify({ type: 'hello', role: 'ferry' }));
    };
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        handleWSMessage(msg);
      } catch (err) {}
    };
    ws.onclose = () => {
      wsReconnectTimer = setTimeout(connectWS, 5000);
    };
    ws.onerror = () => { ws.close(); };
  } catch (e) {
    wsReconnectTimer = setTimeout(connectWS, 5000);
  }
}

function handleWSMessage(msg) {
  if (msg.type === 'killian_annotation') {
    const hl = highlights[msg.highlightId];
    if (hl) {
      hl.killianNote = msg.note;
      hl.killianRevealed = false;
      highlights[hl.id] = hl;
      dbPut('highlights', hl);
    }
  }
}

function syncHighlight(hl) {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({
      type: 'highlight',
      bookId: hl.bookId,
      highlightId: hl.id,
      text: hl.text,
      note: hl.note,
      cfiRange: hl.cfiRange,
      timestamp: Date.now()
    }));
  }
}

function syncProgress() {
  if (ws && ws.readyState === 1 && currentBook) {
    ws.send(JSON.stringify({
      type: 'reading_progress',
      bookId: currentBook.id,
      bookTitle: currentBook.title,
      progress: currentBook.progress,
      location: currentBook.location,
      timestamp: Date.now()
    }));
  }
}

// ===== Stats =====
let sessionStartTime = null;
let sessionReadingMs = 0;

function startReadingTimer() {
  sessionStartTime = Date.now();
}

function getSessionMs() {
  if (!sessionStartTime) return 0;
  return Date.now() - sessionStartTime;
}

function getTodayKey() {
  const d = new Date();
  return `reading_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function saveTodayReading() {
  if (!sessionStartTime) return;
  const key = getTodayKey();
  const prev = parseInt(localStorage.getItem(key) || '0');
  const elapsed = getSessionMs();
  localStorage.setItem(key, prev + elapsed);
  const totalKey = 'reading_total';
  const prevTotal = parseInt(localStorage.getItem(totalKey) || '0');
  localStorage.setItem(totalKey, prevTotal + elapsed);
  sessionStartTime = Date.now();
}

function formatTime(ms) {
  const mins = Math.floor(ms / 60000);
  if (mins < 60) return mins + '分钟';
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h + '小时' + (m > 0 ? m + '分钟' : '');
}

function updateStats() {
  if (!currentBook) return;
  saveTodayReading();
  const progress = currentBook.progress || 0;
  const todayMs = parseInt(localStorage.getItem(getTodayKey()) || '0') + getSessionMs();
  const totalMs = parseInt(localStorage.getItem('reading_total') || '0') + getSessionMs();
  const todayHL = Object.values(highlights).filter(h => {
    const d = new Date(h.createdAt);
    const today = new Date();
    return d.toDateString() === today.toDateString();
  }).length;
  const totalHL = Object.values(highlights).length;

  let estTime = '';
  if (progress > 0 && totalMs > 0) {
    const remaining = totalMs / (progress / 100) - totalMs;
    estTime = '约' + formatTime(remaining) + '读完';
  }

  document.getElementById('statsContent').innerHTML = `
    <div class="stats-line"><span>已读</span><span class="stats-val">${progress}% ${estTime ? '· ' + estTime : ''}</span></div>
    <div class="stats-line"><span>阅读</span><span class="stats-val">今日${formatTime(todayMs)} · 累计${formatTime(totalMs)}</span></div>
    <div class="stats-line"><span>划线</span><span class="stats-val">今日${todayHL}条 · 累计${totalHL}条</span></div>
  `;
}

function updateNotesCount() {
  const count = Object.keys(highlights).length;
  document.getElementById('notesLabel').textContent = count > 0 ? `♡ Notes(${count})` : '♡ Notes';
}

// ===== Export =====
document.getElementById('exportBtn').onclick = () => {
  const hls = Object.values(highlights).sort((a, b) => a.createdAt - b.createdAt);
  if (hls.length === 0) { alert('No notes to export'); return; }

  let text = `${currentBook?.title || 'Book'} — Reading Notes\n\n`;
  hls.forEach(hl => {
    const date = new Date(hl.createdAt);
    const ts = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    text += `"${hl.text}"\n`;
    text += `— ${ts}\n`;
    if (hl.note) text += `Ferry: ${hl.note}\n`;
    if (hl.killianNote && hl.killianRevealed) text += `Killian: ${hl.killianNote}\n`;
    text += `\n`;
  });

  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${currentBook?.title || 'notes'}_notes.txt`;
  a.click();
  URL.revokeObjectURL(url);
};

// ===== Utils =====
function showLoading(show) {
  document.getElementById('loading').classList.toggle('show', show);
}


// ===== Init =====
async function init() {
  // Clear old service workers and caches
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const r of regs) await r.unregister();
  }
  if ('caches' in window) {
    const names = await caches.keys();
    for (const n of names) await caches.delete(n);
  }

  await openDB();
  renderShelf();
  connectWS();

  setInterval(() => {
    if (currentBook && rendition) syncProgress();
  }, 10000);
}


init();
</script>
